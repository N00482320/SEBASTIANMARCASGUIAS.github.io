<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panadería Santa Rosa | Formulario de Pedidos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/marca.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-cafe mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index-bootstrap.html">Panadería Santa Rosa</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index-bootstrap.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="pedidos.html">Pedidos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-3">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <div class="card p-4 shadow-sm">
          <h1 class="h3 mb-4 text-center">Formulario de Pedido</h1>
          <form id="form-pedido" novalidate>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" name="nombre" required>
              <p id="error-nombre" class="text-danger small mt-1 d-none"></p>
            </div>

            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección de entrega</label>
              <input type="text" class="form-control" id="direccion" name="direccion" required>
              <p id="error-direccion" class="text-danger small mt-1 d-none"></p>
            </div>

            <div class="mb-3">
              <label for="tienda" class="form-label">Seleccionar tienda de despacho</label>
              <select class="form-select" id="tienda" name="tienda">
                <option value="brena">Tienda 1 - Breña</option>
                <option value="san-miguel">Tienda 2 - San Miguel</option>
              </select>
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="terminos" required>
              <label class="form-check-label" for="terminos">Acepto los términos y condiciones</label>
              <p id="error-terminos" class="text-danger small mt-1 d-none"></p>
            </div>

            <button type="submit" class="btn btn-marca w-100 py-2">Confirmar y Enviar Pedido</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-cafe text-white py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">Panadería Santa Rosa &copy; 2026 - Todos los derechos reservados</p>
    </div>
  </footer>
</body>
</html>
